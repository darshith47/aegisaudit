[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisaudit-backend"
version = "0.1.0"
description = "Authorized Credential Security Assessment Platform - Backend Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AegisAudit Core Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S"]
ignore = [
    "S101",  # Allow assert in tests
    "S104",  # Allow 0.0.0.0 binding for container networks
    "S105",  # Allow token strings in test fixtures
    "S106",  # Allow demo/test passwords in test fixtures
    "B008",  # Allow FastAPI Depends in route defaults
    "E501",  # Line length managed by Black
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
